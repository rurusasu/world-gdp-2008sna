name: Validate and publish GDP report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Nix development environment
        run: nix flake check
      - name: Install report dependencies
        run: nix develop --command uv sync --locked
      - name: Verify acquisition and calculation contracts
        run: nix develop --command uv run --locked python -m unittest discover -s tests -v
      - name: Rebuild from checksum-verified committed sources
        run: nix develop --command uv run --locked python -m gdp_report build
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload verified report
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v5.0.1
